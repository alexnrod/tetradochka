services:
  bot:
    # Built by .github/workflows/deploy.yml and loaded with `docker load`; never pulled.
    image: tetradochka-bot:latest
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    # The VM is in Russia, where the IP that DNS returns for api.telegram.org is blocked; this Telegram API address is reachable.
    extra_hosts:
      - api.telegram.org:149.154.167.220
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - bot_data:/data

volumes:
  bot_data:

networks:
  default:
    driver_opts:
      # The VM's ens3 has MTU 1450; Docker's default 1500 stalls large TLS responses.
      com.docker.network.driver.mtu: "1450"
